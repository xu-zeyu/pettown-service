spring:
  application:
    name: pettown-admin
  config:
    import: optional:file:${PETTOWN_ENV_FILE:./.env}[.properties]
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

pettown:
  redis:
    enabled: ${PETTOWN_REDIS_ENABLED:true}
  admin:
    bootstrap:
      enabled: ${PETTOWN_ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${PETTOWN_ADMIN_BOOTSTRAP_USERNAME:}
      password: ${PETTOWN_ADMIN_BOOTSTRAP_PASSWORD:}
      phone: ${PETTOWN_ADMIN_BOOTSTRAP_PHONE:}
    captcha:
      # 仅填写会覆盖 X-Real-IP 的可信反向代理直连地址；留空时始终使用 TCP 来源地址。
      trusted-proxy-ips: ${PETTOWN_ADMIN_CAPTCHA_TRUSTED_PROXY_IPS:}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    local-cache-scope: statement

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: ${PETTOWN_ADMIN_TOKEN_TIMEOUT:7200}
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  token-style: random-64
  is-log: false
  is-print: false

server:
  port: ${SERVER_PORT:8081}

springdoc:
  packages-to-scan: com.pettown.admin
  paths-to-match:
    - /mng/**
    - /api/admin/auth/login
    - /api/admin/auth/me
    - /api/admin/auth/menus
    - /api/admin/auth/change-password
    - /api/admin/system/accounts
    - /api/admin/system/accounts/{id}
    - /api/admin/system/accounts/{id}/status
    - /api/admin/system/accounts/{id}/reset-password
    - /api/admin/system/roles
    - /api/admin/system/roles/{id}
    - /api/admin/users
    - /api/admin/users/{id}
    - /api/admin/users/{id}/status
    - /api/admin/users/{id}/pets
    - /api/admin/verification/captcha
    - /api/admin/system/permissions
    - /api/admin/system/permissions/sync
    - /api/admin/system/roles/{id}/permissions
  default-flat-param-object: true
