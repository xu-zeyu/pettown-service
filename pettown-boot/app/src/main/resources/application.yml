spring:
  application:
    name: pettown-app
  config:
    import: optional:file:${PETTOWN_ENV_FILE:./.env}[.properties]
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

pettown:
  redis:
    enabled: ${PETTOWN_REDIS_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  packages-to-scan: com.pettown.app
  paths-to-match: /api/pets/**
  default-flat-param-object: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: ${PETTOWN_TOKEN_TIMEOUT:2592000}
  active-timeout: -1
  is-concurrent: false
  is-share: false
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  token-style: random-64
  is-log: ${SA_TOKEN_IS_LOG:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
