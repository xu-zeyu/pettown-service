# 供项目 stack_profiles 引用的技术栈 ID
id: "python_backend"
# 技术栈展示名称
display_name: "Python 后端"
# 适用项目类型，仅供匹配参考
applies_to: ["Python 服务", "FastAPI/Django/Flask 项目"]

# 扫描仓库时使用的线索，不代表已核实事实
discovery:
  # 优先检查的文件或目录
  inspect_files:
    - "pyproject.toml"
    - "requirements*.txt"
    - "Pipfile"
    - "poetry.lock"
    - "uv.lock"
    - "src"
    - "tests"
  # 需从仓库或项目文档确认的事实
  identify:
    - "Python 版本和依赖管理工具"
    - "Web 框架、应用入口和模块边界"
    - "数据库访问和迁移机制"
    - "格式化、代码检查、类型检查和测试命令"

# 使用该技术栈时应遵循的编码和审批约束
rules:
  - "使用仓库现有的虚拟环境和依赖管理工具。"
  - "未经明确要求，不新增独立服务或基础设施。"
  - "不得将密钥写入源码或 `.ai`。"
