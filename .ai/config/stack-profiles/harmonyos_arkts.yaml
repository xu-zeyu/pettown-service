# 供项目 stack_profiles 引用的技术栈 ID
id: "harmonyos_arkts"
# 技术栈展示名称
display_name: "HarmonyOS / ArkTS"
# 适用项目类型，仅供匹配参考
applies_to: ["HarmonyOS 应用", "ArkTS 项目"]

# 扫描仓库时使用的线索，不代表已核实事实
discovery:
  # 优先检查的文件或目录
  inspect_files:
    - "oh-package.json5"
    - "build-profile.json5"
    - "module.json5"
    - "hvigorfile.ts"
    - "hvigorfile.js"
    - "AppScope"
    - "entry/src"
  # 需从仓库或项目文档确认的事实
  identify:
    - "HarmonyOS API 和 SDK 版本"
    - "项目文档中记录的 DevEco Studio 版本"
    - "模块结构、deviceTypes 和 Ability 配置"
    - "ArkTS 语言限制和项目检查规则"
    - "签名、权限、网络和数据访问配置"
    - "实际 Hvigor 构建和测试命令"
    - "客户端 UI 规范、组件状态、设备尺寸、动效与无障碍要求；写入项目 ui-guidelines.md"

# 使用该技术栈时应遵循的编码和审批约束
rules:
  - "使用项目实际 API/SDK 版本，不得擅自假设为最新版本。"
  - "遵循 ArkTS 语言限制和项目现有开发模式。"
  - "权限、签名、设备类型和分发配置变更必须人工审批。"
  - "未经审批不得暴露签名凭证或修改正式发布配置。"
