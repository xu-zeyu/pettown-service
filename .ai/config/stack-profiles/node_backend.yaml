# 供项目 stack_profiles 引用的技术栈 ID
id: "node_backend"
# 技术栈展示名称
display_name: "Node.js 后端"
# 适用项目类型，仅供匹配参考
applies_to: ["Node.js 服务", "NestJS/Express/Koa 项目"]

# 扫描仓库时使用的线索，不代表已核实事实
discovery:
  # 优先检查的文件或目录
  inspect_files:
    - "package.json"
    - "pnpm-lock.yaml"
    - "package-lock.json"
    - "yarn.lock"
    - "src"
    - "test"
  # 需从仓库或项目文档确认的事实
  identify:
    - "Node.js 版本和包管理器"
    - "服务框架和应用模块"
    - "接口校验、认证和授权方式"
    - "数据库访问和迁移机制"
    - "构建、代码检查和测试脚本"

# 使用该技术栈时应遵循的编码和审批约束
rules:
  - "根据锁文件使用对应包管理器。"
  - "遵循项目已有 API 和模块规范。"
  - "新增依赖或基础设施前必须获得审批。"
