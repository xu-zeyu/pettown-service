# 供项目 stack_profiles 引用的技术栈 ID
id: "vue_frontend"
# 技术栈展示名称
display_name: "Vue / Web 前端"
# 适用项目类型，仅供匹配参考
applies_to: ["Vue 应用", "Web 前端"]

# 扫描仓库时使用的线索，不代表已核实事实
discovery:
  # 优先检查的文件或目录
  inspect_files:
    - "package.json"
    - "pnpm-lock.yaml"
    - "package-lock.json"
    - "yarn.lock"
    - "vite.config.*"
    - "vue.config.*"
    - "src"
  # 需从仓库或项目文档确认的事实
  identify:
    - "Vue 版本和 Node.js 版本"
    - "Vue 2 或 Vue 3，以及路由和状态管理方案"
    - "UI 组件库和样式规范"
    - "API 请求封装、认证和路由权限模式"
    - "代码检查、类型检查、构建和测试脚本"

# 使用该技术栈时应遵循的编码和审批约束
rules:
  - "根据锁文件选择正确的包管理器。"
  - "遵循项目现有组件、组合式函数、状态管理和 API 组织方式。"
  - "新增依赖前说明原因并获得审批。"
  - "不得在代码中硬编码令牌、账号凭证或环境密钥。"
