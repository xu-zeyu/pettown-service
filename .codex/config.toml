[mcp_servers.tapd]
command = "/opt/homebrew/bin/uvx"
args = ["mcp-server-tapd"]
env_vars = ["TAPD_ACCESS_TOKEN"]
startup_timeout_sec = 30

[mcp_servers.tapd.env]
TAPD_API_BASE_URL = "https://api.tapd.cn"
